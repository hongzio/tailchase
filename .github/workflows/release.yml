name: Release
on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]*"
permissions:
  contents: read
concurrency:
  group: tailchase-release
  cancel-in-progress: false
jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Check requested tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          expected="v$(ruby -rjson -e 'puts JSON.parse(File.read("packaging/release.json")).fetch("version")')"
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "$expected" ]; then
            echo "Tag does not match packaging/release.json" >&2
            exit 1
          fi
      - run: go test -race ./...
      - name: Build four standalone binaries and formula
        run: go run ./packaging/release
      - name: Publish and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/publish-assets.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tailchase-binary-release
          path: |
            dist/*
            packaging/tailchase.rb
